---
# Layer 10 - network devices.
# Switches (role ios_switch):
#   default         read-only snapshot -> build/network/<switch>/
#                   ansible-playbook 10-network.yml --limit l2sw
#   --tags apply    push host_vars/<switch>/ios_resources.yml; preview first:
#                   ansible-playbook 10-network.yml --tags apply --check --diff --limit l2sw
#                   a real run also needs -e network_apply_confirm=true
# pfSense (role pfsense):
#   default                read-only copy of config.xml -> build/network/pfsense/
#   --tags pfsense-backup  same, then store it vault-encrypted in files/pfsense/
#   --tags pfsense-apply   push host_vars/pfsense/pfsense_resources.yml (aliases,
#                          rules); preview with --check --diff, real run needs
#                          -e pfsense_apply_confirm=true
#   --tags pfsense-restore DESTRUCTIVE: push the backup and reboot,
#                          needs -e pfsense_restore_confirm=true

- name: Snapshot Cisco switches (read-only)
  hosts: switches
  gather_facts: false
  # Local file writes are delegated to the laptop: no sudo there.
  become: false

  tasks:
    - name: Snapshot the switch
      ansible.builtin.import_role:
        name: ios_switch
        tasks_from: snapshot

- name: Apply switch configuration
  hosts: switches
  gather_facts: false
  become: false
  serial: 1
  any_errors_fatal: true
  tags: [never, apply]

  tasks:
    - name: Apply the configuration as code
      ansible.builtin.import_role:
        name: ios_switch
        tasks_from: apply

- name: pfSense configuration
  hosts: firewall
  gather_facts: false
  become: false

  tasks:
    - name: Snapshot pfSense
      ansible.builtin.import_role:
        name: pfsense
        tasks_from: snapshot

    - name: Store the configuration encrypted in the repo
      ansible.builtin.import_role:
        name: pfsense
        tasks_from: backup
      tags: [never, pfsense-backup]

    - name: Apply aliases and filter rules as code
      ansible.builtin.import_role:
        name: pfsense
        tasks_from: apply
      tags: [never, pfsense-apply]

# DESTRUCTIVE: gateway and VPN of the rack reboot.
- name: Restore the pfSense configuration (DESTRUCTIVE)
  hosts: firewall
  gather_facts: false
  become: false
  tags: [never, pfsense-restore]

  tasks:
    - name: Restore the versioned configuration and reboot
      ansible.builtin.import_role:
        name: pfsense
        tasks_from: restore
