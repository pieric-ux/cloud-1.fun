# Modules added to the official snmp.yml (not in the upstream generator
# output): STP state of the Cisco switches, appended under "modules:".
bridge_stp:
  metrics:
  - help: 'STP protocol: 1=unknown, 2=decLb100, 3=ieee8021d'
    name: dot1dStpProtocolSpecification
    oid: 1.3.6.1.2.1.17.2.1
    type: gauge
  - help: Total number of topology changes since last reset
    name: dot1dStpTopChanges
    oid: 1.3.6.1.2.1.17.2.4
    type: counter
  - help: Port number of the root port (0 if this bridge is root)
    name: dot1dStpRootPort
    oid: 1.3.6.1.2.1.17.2.7
    type: gauge
  - help: 'STP port state: 1=disabled, 2=blocking, 3=listening, 4=learning, 5=forwarding,
      6=broken'
    indexes:
    - labelname: dot1dStpPort
      type: gauge
    name: dot1dStpPortState
    oid: 1.3.6.1.2.1.17.2.15.1.3
    type: gauge
  walk:
  - 1.3.6.1.2.1.17.2.1
  - 1.3.6.1.2.1.17.2.4
  - 1.3.6.1.2.1.17.2.7
  - 1.3.6.1.2.1.17.2.15.1.3
cisco_stp:
  metrics:
  - help: 'STP type: 1=pvstPlus, 2=mistp, 3=mistpPvstPlus, 4=mst, 5=rapidPvstPlus'
    name: stpxSpanningTreeType
    oid: 1.3.6.1.4.1.9.9.82.1.1.1
    type: gauge
  - help: 'STP notification enabled: 1=yes, 2=no'
    name: stpxNotificationEnable
    oid: 1.3.6.1.4.1.9.9.82.1.1.5
    type: gauge
  - help: 'Loop guard global mode: 1=enable, 2=disable'
    name: stpxLoopGuardGlobalDefaultMode
    oid: 1.3.6.1.4.1.9.9.82.1.4.1
    type: gauge
  - help: Number of loop inconsistencies detected
    name: stpxLoopInconsistencyIndex
    oid: 1.3.6.1.4.1.9.9.82.1.4.2
    type: counter
  - help: Number of loop inconsistency updates
    name: stpxLoopInconsistencyUpdate
    oid: 1.3.6.1.4.1.9.9.82.1.4.3
    type: counter
  - help: Number of root inconsistencies detected
    name: stpxRootInconsistencyIndex
    oid: 1.3.6.1.4.1.9.9.82.1.4.4
    type: counter
  - help: Number of root inconsistency updates
    name: stpxRootInconsistencyUpdate
    oid: 1.3.6.1.4.1.9.9.82.1.4.5
    type: counter
  - help: Number of BPDU guard violations
    name: stpxBpduGuardViolationCounter
    oid: 1.3.6.1.4.1.9.9.82.1.4.6
    type: counter
  walk:
  - 1.3.6.1.4.1.9.9.82.1.1
  - 1.3.6.1.4.1.9.9.82.1.4
