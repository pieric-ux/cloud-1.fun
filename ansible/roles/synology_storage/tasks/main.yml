---
# Storage of the cluster on the NAS, through the DSM web API: audit (always)
# and, with storage_apply, creation of the missing iSCSI objects first.
- name: DSM session
  block:
    - name: Login
      ansible.builtin.import_tasks: session.yml

    - name: Read the live configuration
      ansible.builtin.import_tasks: read.yml

    - name: Create the missing iSCSI objects
      ansible.builtin.include_tasks:
        file: create.yml
        apply: {tags: [always]}
      when: storage_apply | bool

    - name: Audit against the code
      ansible.builtin.import_tasks: audit.yml

  always:
    - name: Logout
      ansible.builtin.import_tasks: logout.yml
