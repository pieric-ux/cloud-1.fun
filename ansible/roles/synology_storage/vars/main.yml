---
# Derived values (lazy: evaluated once the reads exist).
storage_sid: "{{ (storage_login.content | from_json).data.sid }}"
# Live data per read (luns, targets, shares, nfs), and NFS rules per share.
storage_live: >-
  {{ dict(storage_reads.results | map(attribute='item.name')
     | zip(storage_reads.results | map(attribute='content') | map('from_json') | map(attribute='data'))) }}
storage_nfs_live: >-
  {{ dict(storage_nfs_reads.results | map(attribute='item.name')
     | zip(storage_nfs_reads.results | map(attribute='content') | map('from_json')
           | map(attribute='data') | map(attribute='rule', default=[]))) }}

# Creation (create.yml): missing objects, and parameters JSON-encoded as the
# web UI sends them (from storage_raw_params, set per task).
storage_luns_missing: >-
  {{ storage_luns | rejectattr('name', 'in', storage_live.luns.luns | map(attribute='name') | list) | list }}
storage_targets_missing: >-
  {{ storage_iscsi_targets | rejectattr('iqn', 'in', storage_live.targets.targets | map(attribute='iqn') | list) | list }}
storage_json_params: "{{ dict(storage_raw_params.keys() | zip(storage_raw_params.values() | map('to_json'))) }}"
