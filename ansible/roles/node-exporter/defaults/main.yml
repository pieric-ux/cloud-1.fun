---
# Official release from https://github.com/prometheus/node_exporter/releases.
# code: language=ansible
node_exporter_version: "1.12.1"
node_exporter_checksums:
  amd64: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
  arm64: "sha256:ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"

node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
node_exporter_arch: "{{ node_exporter_arch_map[ansible_facts['architecture']] }}"

node_exporter_user: node_exporter
node_exporter_binary: /usr/local/bin/node_exporter
node_exporter_cache_dir: /var/cache/node_exporter

node_exporter_listen_address: "{{ ansible_facts['default_ipv4']['address'] }}"
node_exporter_port: 9100
