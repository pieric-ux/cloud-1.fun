---
- name: Dedicated system group
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true

- name: Dedicated system user, no shell, no home
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Cache directory for the release archive
  ansible.builtin.file:
    path: "{{ node_exporter_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  check_mode: false

- name: Download the official release, checksum verified
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    checksum: "{{ node_exporter_checksums[node_exporter_arch] }}"
    owner: root
    group: root
    mode: "0644"
  check_mode: false

- name: Extract the release
  ansible.builtin.unarchive:
    src: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "{{ node_exporter_cache_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
  check_mode: false

- name: Install the binary
  ansible.builtin.copy:
    src: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_binary }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  register: node_exporter_unit
  notify: Restart node_exporter

- name: Enabled at boot and running
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and node_exporter_unit is changed)

- name: Apply a pending restart before the check
  ansible.builtin.meta: flush_handlers

- name: Check that the metrics answer on the management address
  ansible.builtin.uri:
    url: "http://{{ node_exporter_listen_address }}:{{ node_exporter_port }}/metrics"
    return_content: false
  register: node_exporter_metrics
  until: node_exporter_metrics.status == 200
  retries: 5
  delay: 2
  when: not ansible_check_mode
