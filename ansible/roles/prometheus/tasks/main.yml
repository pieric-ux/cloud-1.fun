---
- name: Dedicated system group
  ansible.builtin.group:
    name: "{{ prometheus_user }}"
    system: true

- name: Dedicated system user, no shell, no home
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ prometheus_cache_dir }}", owner: root, mode: "0755" }
    - { path: "{{ prometheus_config_dir }}", owner: root, mode: "0755" }
    - { path: "{{ prometheus_config_dir }}/rules", owner: root, mode: "0755" }
    - { path: "{{ prometheus_data_dir }}", owner: "{{ prometheus_user }}", mode: "0750" }
  check_mode: false

- name: Download the official release, checksum verified
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "{{ prometheus_cache_dir }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    checksum: "{{ prometheus_checksum }}"
    owner: root
    group: root
    mode: "0644"
  check_mode: false

- name: Extract the release
  ansible.builtin.unarchive:
    src: "{{ prometheus_cache_dir }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "{{ prometheus_cache_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ prometheus_cache_dir }}/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
  check_mode: false

- name: Install the binaries (also in check mode, so promtool can validate the config)
  ansible.builtin.copy:
    src: "{{ prometheus_cache_dir }}/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  check_mode: false
  notify: Restart prometheus

- name: Alert rules (validated by promtool)
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/alerts.yml"
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0640"
    validate: "{{ prometheus_promtool }} check rules %s"
  notify: Restart prometheus

- name: Main configuration (validated by promtool)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0640"
    validate: "{{ prometheus_promtool }} check config %s"
  notify: Restart prometheus

- name: Systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  register: prometheus_unit
  notify: Restart prometheus

- name: Enabled at boot and running
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and prometheus_unit is changed)

- name: Apply a pending restart before the check
  ansible.builtin.meta: flush_handlers

- name: Check that Prometheus is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
    status_code: 200
  register: prometheus_ready
  until: prometheus_ready.status == 200
  retries: 10
  delay: 3
  when: not ansible_check_mode
