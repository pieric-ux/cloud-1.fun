---
# Sites of files/sites/, all enabled (one file per name, 00-default refuses
# the names without a site). A file left in sites-enabled but not listed here
# is reported, not removed.
rproxy_sites: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/sites/*', wantlist=True) | map('basename') | sort }}"

# Wildcard certificate of the domain, DNS-01 through the Infomaniak API.
rproxy_domain: cloud-1.fun
rproxy_cert_dir: "/etc/letsencrypt/live/{{ rproxy_domain }}"
rproxy_acme_email: demont.pieric@protonmail.com
rproxy_infomaniak_ini: "{{ vault_rproxy_infomaniak_ini }}"
