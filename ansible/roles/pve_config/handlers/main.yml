---
- name: Reload chrony sources
  ansible.builtin.command: chronyc reload sources
  changed_when: true

- name: Restart iscsid
  ansible.builtin.service:
    name: iscsid
    state: restarted

- name: Reload multipathd
  ansible.builtin.service:
    name: multipathd
    state: reloaded
