---
# Checked against the live nodes on 2026-10-30 (--check --diff, no change
# besides "Enabled: no" -> "false" on pve01). Always preview with
# --check --diff first. Cluster join stays manual (cluster.yml, not
# imported).
- name: Refuse a real run without explicit confirmation
  ansible.builtin.assert:
    that: ansible_check_mode or (pve_config_confirm | bool)
    fail_msg: >-
      Real change on {{ inventory_hostname }}: preview with --check --diff,
      then re-run with -e pve_config_confirm=true.

- name: Package repositories
  ansible.builtin.import_tasks: repos.yml

- name: Name resolution and time
  ansible.builtin.import_tasks: system.yml

- name: Initiator and multipath for iSCSI
  ansible.builtin.import_tasks: iscsi.yml

# Cluster-wide from here (run once): the node must already be in the cluster
# (manual join, see cluster.yml), or these would land in its own config.
- name: Datacenter options
  ansible.builtin.import_tasks: datacenter.yml

- name: Storages
  ansible.builtin.import_tasks: storage.yml

- name: Backup jobs
  ansible.builtin.import_tasks: backup.yml

- name: API access (roles, users, tokens, ACL)
  ansible.builtin.import_tasks: access.yml
