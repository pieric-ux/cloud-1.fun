---
# Enterprise and ceph repositories need a subscription key (apt update fails
# with HTTP 401): disabled. No-subscription repository in deb822 format.
- name: Disable the enterprise and ceph repositories
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ item }}.sources"
    regexp: '^Enabled:'
    line: 'Enabled: false'
    insertafter: EOF
  loop: [pve-enterprise, ceph]

- name: No-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ pve_repo_suite }}
      Components: {{ pve_repo_component }}
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
