---
# Cluster-wide backup jobs (/etc/pve/jobs.cfg): created only when missing,
# with their recorded id, an existing job is never modified here.
- name: Read the backup jobs
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: pve_backup_status
  changed_when: false
  check_mode: false
  run_once: true

- name: Backup jobs to create
  ansible.builtin.debug:
    msg: "{{ pve_backup_jobs_missing | map(attribute='id') | list }}"
  changed_when: true
  when: pve_backup_jobs_missing | length > 0
  run_once: true

- name: Create the missing backup jobs
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'create', '/cluster/backup', '--id', item.id]
         + (item.options.keys() | map('regex_replace', '^', '--')
            | zip(item.options.values() | map('string')) | flatten) }}
  changed_when: true
  loop: "{{ pve_backup_jobs_missing }}"
  loop_control:
    label: "{{ item.id }}"
  when: not ansible_check_mode
  run_once: true
