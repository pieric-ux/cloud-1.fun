---
- name: The read-only token must be provided
  ansible.builtin.assert:
    that: pve_exporter_token | length > 0
    fail_msg: "pve_exporter_token is empty: pass it with --extra-vars pve_exporter_token=... or Ansible Vault."

- name: Dedicated system group
  ansible.builtin.group:
    name: "{{ pve_exporter_user }}"
    system: true

- name: Dedicated system user, no shell, no home
  ansible.builtin.user:
    name: "{{ pve_exporter_user }}"
    group: "{{ pve_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Python venv tooling
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Install prometheus-pve-exporter in a venv
  ansible.builtin.pip:
    name: "prometheus-pve-exporter=={{ pve_exporter_version }}"
    virtualenv: "{{ pve_exporter_venv }}"
    virtualenv_command: "python3 -m venv"
  notify: Restart pve-exporter

- name: Configuration with the read-only token
  ansible.builtin.template:
    src: pve.yml.j2
    dest: "{{ pve_exporter_config }}"
    owner: root
    group: "{{ pve_exporter_user }}"
    mode: "0640"
  no_log: true
  notify: Restart pve-exporter

- name: Systemd unit
  ansible.builtin.template:
    src: pve-exporter.service.j2
    dest: /etc/systemd/system/pve-exporter.service
    owner: root
    group: root
    mode: "0644"
  register: pve_exporter_unit
  notify: Restart pve-exporter

- name: Enabled at boot and running
  ansible.builtin.systemd_service:
    name: pve-exporter
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and pve_exporter_unit is changed)

- name: Apply a pending restart before the check
  ansible.builtin.meta: flush_handlers

- name: Check that the exporter answers for pve01
  ansible.builtin.uri:
    url: "http://{{ pve_exporter_listen_address }}:{{ pve_exporter_port }}/pve?target=pve01.cloud-1.fun&cluster=1&node=1"
    return_content: false
  register: pve_exporter_metrics
  until: pve_exporter_metrics.status == 200
  retries: 5
  delay: 3
  when: not ansible_check_mode
