---
- name: Dependencies for the apt repository
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
    state: present
    update_cache: true

- name: Keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Grafana apt signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"
  check_mode: false

- name: Grafana apt repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Provisioned Prometheus datasource
  ansible.builtin.template:
    src: datasource-prometheus.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Admin password (only when provided via vault/extra-vars)
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^\s*;?\s*admin_password\s*='
    line: "admin_password = {{ grafana_admin_password }}"
    insertafter: '^\[security\]'
  when: grafana_admin_password | length > 0
  no_log: true
  notify: Restart grafana

- name: Enabled at boot and running
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a pending restart before the check
  ansible.builtin.meta: flush_handlers

- name: Check that Grafana is healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/health"
    return_content: true
  register: grafana_health
  until: grafana_health.status == 200 and (grafana_health.json.database | default('')) == 'ok'
  retries: 15
  delay: 4
  when: not ansible_check_mode
