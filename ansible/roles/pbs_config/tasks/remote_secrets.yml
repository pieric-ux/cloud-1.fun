---
# Remote passwords are stored base64-encoded in remote.cfg: compared with the
# vault without displaying either (only the result is kept).
- name: Read the remotes
  ansible.builtin.command: proxmox-backup-debug api get /config/remote --output-format json
  register: pbs_remote_status
  changed_when: false
  check_mode: false

- name: Read remote.cfg
  ansible.builtin.slurp:
    src: /etc/proxmox-backup/remote.cfg
  register: pbs_remote_cfg
  no_log: true

- name: Compare the remote passwords with the vault
  ansible.builtin.set_fact:
    pbs_remote_secrets_ok: >-
      {{ pbs_remote_secrets_ok | default({}) | combine({item.0.id ~ ' ' ~ item.1.option:
         (pbs_remote_cfg.content | b64decode
          | regex_search('(?ms)^remote: ' ~ item.0.id ~ '$.*?^\t' ~ item.1.option ~ ' (\S+)$', '\1')
          | default([''], true) | first) == (query('vars', item.1.var) | first | b64encode)}) }}
  loop: "{{ pbs_remotes | selectattr('id', 'in', pbs_remote_status.stdout | from_json | map(attribute='name')) | subelements('secrets', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.id }} {{ item.1.option }}"
  no_log: true

- name: Vault remote passwords match the server
  ansible.builtin.assert:
    that: pbs_remote_secrets_ok | dict2items | rejectattr('value') | list | length == 0
    fail_msg: "Differs from the vault: {{ pbs_remote_secrets_ok | dict2items | rejectattr('value') | map(attribute='key') | list }}"
    success_msg: "{{ pbs_remote_secrets_ok.keys() | list }} match the vault"
  when: pbs_remote_secrets_ok is defined
