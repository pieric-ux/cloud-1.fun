---
# Must match the control plane version.
k3s_version: ""

k3s_api_endpoint: "{{ hostvars[groups['k3s_control'][0]]['ansible_host'] }}"

k3s_install_script: /usr/local/bin/k3s-install.sh
# Install script of the pinned release, not get.k3s.io (which changes
# upstream): the same script for every node and every rebuild.
k3s_install_script_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
