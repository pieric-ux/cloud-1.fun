---
# Proxmox VE node configuration (role pve_config). Values from the piscine
# module 03 docs (cluster_setup, iscsi_setup, proxmox_integration,
# backup_restore): to check against the live nodes before any run.
pve_fqdn: "{{ inventory_hostname }}.cloud-1.fun"

# iSCSI target on the Synology (one-way CHAP, masking by initiator IQN).
pve_iscsi_chap_user: pveiscsi
# Secret in the team password manager: to add to a vault (not in the repo yet).
pve_iscsi_chap_password: "{{ vault_pve_iscsi_chap_password }}"
pve_iscsi_lun_wwid: 360014051fae838bdedf5d4c82d85dadd
pve_iscsi_multipath_alias: mpath-synology

# Cluster-wide storages (created only when missing, by storage.yml).
pve_storages:
  - name: synology-iscsi
    type: iscsi
    options: "--portal 10.1.20.21 --target iqn.2026-10.lab.infra:prox --content none"
  - name: synology-lvm
    type: lvm
    options: "--vgname vg-synology --base synology-iscsi:0.0.1.scsi-360014051fae838bdedf5d4c82d85dadd --content images,rootdir --shared 1 --saferemove 0"
  - name: synology-iso
    type: nfs
    options: "--server 10.1.20.21 --export /volume1/iso --content iso,vztmpl"

# Cluster (manual for now, see roles/pve_config/tasks/cluster.yml).
pve_cluster_name: INFRA-CLUSTER
pve_qdevice: 10.1.240.13
