---
# Proxmox VE node configuration (role pve_config). Values from the piscine
# module 03 docs (cluster_setup, iscsi_setup, proxmox_integration,
# backup_restore), checked against the live nodes on 2026-10-30.
pve_fqdn: "{{ inventory_hostname }}.cloud-1.fun"

# iSCSI target on the Synology (one-way CHAP, masking by initiator IQN).
pve_iscsi_chap_user: pveiscsi
# Secret in group_vars/pve/vault.yml (copy of the team password manager).
pve_iscsi_chap_password: "{{ vault_pve_iscsi_chap_password }}"
pve_iscsi_lun_wwid: 360014051fae838bdedf5d4c82d85dadd
pve_iscsi_multipath_alias: mpath-synology

# Datacenter options (/etc/pve/datacenter.cfg, set through the API).
pve_datacenter_options:
  keyboard: en-us
  crs: ha=static
  ha: shutdown_policy=migrate
  # Live migration on the direct 10 GbE link between the nodes (bond1).
  migration: network=10.1.230.1/30,type=secure

# Cluster-wide storages (created only when missing, by storage.yml), in
# creation order (synology-lvm sits on synology-iscsi). `secrets` gives, per
# API option, the NAME of its vault variable: looked up only at creation time
# (and to compare with /etc/pve/priv/storage/ when the variable is set).
pve_storages:
  - name: synology-iscsi
    type: iscsi
    options:
      portal: 10.1.20.21
      target: iqn.2026-10.lab.infra:prox
      content: none
  - name: synology-lvm
    type: lvm
    options:
      vgname: vg-synology
      base: synology-iscsi:0.0.1.scsi-{{ pve_iscsi_lun_wwid }}
      content: images,rootdir
      shared: 1
      saferemove: 0
  - name: synology-iso
    type: nfs
    options:
      server: 10.1.20.21
      export: /volume1/iso
      content: iso,vztmpl
      prune-backups: keep-all=1
  # PBS of the rack (VM 2400 on pve02): restore it before adding this storage
  # on a rebuilt cluster, the API checks the datastore on creation.
  - name: pbs-store1
    type: pbs
    options:
      server: 10.1.240.30
      datastore: store1
      username: pve@pbs!pve-cluster
      fingerprint: eb:c7:74:b8:9d:4c:dc:89:08:29:dc:3e:85:46:ca:a6:c4:71:1d:f7:88:4d:68:9e:5a:3d:3a:dd:4a:4c:1b:82
      content: backup
      prune-backups: keep-all=1
    secrets:
      - {option: password, var: vault_pve_pbs_store1_token}
  # Offsite PBS, client-side encrypted: WITHOUT this key no offsite backup
  # can be restored (key also in the team password manager).
  - name: pbs-offsite
    type: pbs
    options:
      server: 195.15.202.63
      datastore: offsite1
      username: pve-restore@pbs!dr
      fingerprint: b0:e4:94:55:b8:db:14:71:91:1f:6a:e2:bd:1a:23:c0:35:99:9e:e6:65:6a:32:be:a5:41:86:cc:8e:c6:4c:40
      content: backup
      prune-backups: keep-all=1
    secrets:
      - {option: password, var: vault_pve_pbs_offsite_token}
      - {option: encryption-key, var: vault_pve_pbs_offsite_encryption_key}

# Backup jobs (/etc/pve/jobs.cfg, created only when missing, by backup.yml).
pve_backup_jobs:
  - id: a1c9c060-8174-4253-bcbf-413e23c57468
    options:
      comment: Daily backup to PBS
      schedule: "02:00"
      storage: pbs-store1
      mode: snapshot
      all: 1
      # The PBS VM does not back itself up into its own datastore.
      exclude: "2400"
      enabled: 1
      prune-backups: keep-all=1
      # Proxmox placeholder, not Jinja (kept verbatim by !unsafe).
      notes-template: !unsafe "{{guestname}}"  # noqa: jinja[spacing]

# API access (access.yml): roles, users and ACL created when missing (role
# privileges and user comments kept in line), tokens created when missing.
pve_roles:
  - id: PackerRole
    privs: [Datastore.AllocateSpace, Datastore.AllocateTemplate, Datastore.Audit,
            SDN.Use, Sys.Audit, Sys.Modify, VM.Allocate, VM.Audit, VM.Clone,
            VM.Config.CDROM, VM.Config.CPU, VM.Config.Cloudinit, VM.Config.Disk,
            VM.Config.HWType, VM.Config.Memory, VM.Config.Network,
            VM.Config.Options, VM.Console, VM.GuestAgent.Audit, VM.PowerMgmt]
  # Layer 20 (bpg/proxmox): the provider's list adapted to PVE 9 (VM.Monitor
  # replaced by VM.GuestAgent.Audit), plus migration and HA (Sys.Console).
  - id: TerraformProv
    privs: [Datastore.Allocate, Datastore.AllocateSpace, Datastore.AllocateTemplate,
            Datastore.Audit, Mapping.Audit, Mapping.Use, Pool.Allocate, Pool.Audit,
            SDN.Use, Sys.Audit, Sys.Console, Sys.Modify, VM.Allocate, VM.Audit,
            VM.Clone, VM.Config.CDROM, VM.Config.CPU, VM.Config.Cloudinit,
            VM.Config.Disk, VM.Config.HWType, VM.Config.Memory, VM.Config.Network,
            VM.Config.Options, VM.Console, VM.GuestAgent.Audit, VM.Migrate,
            VM.PowerMgmt]

pve_users:
  - id: monitoring@pve
    comment: Prometheus pve-exporter (read-only)
  - id: packer@pve
    comment: Packer build user
  - id: terraform@pve
    comment: Terraform

# API tokens, privilege-separated by default (rights from their own ACL);
# `privsep: 0` inherits the rights of the user. A token created here gets a
# new secret, written to `secret_file` (local, gitignored) if set, otherwise
# to build/pve-tokens/<token id> for the client to be updated.
pve_tokens:
  - id: monitoring@pve!exporter
  # Used by Packer (15-templates), no expiry.
  - id: packer@pve!pieric
    privsep: 0
  - id: terraform@pve!iac
    comment: Terraform
    secret_file: "{{ playbook_dir }}/../20-proxmox/terraform.tfvars"

pve_acls:
  - {path: /, role: PVEAuditor, ugid: monitoring@pve}
  - {path: /, role: PVEAuditor, ugid: monitoring@pve!exporter}
  - {path: /, role: PackerRole, ugid: packer@pve}
  - {path: /, role: TerraformProv, ugid: terraform@pve}
  - {path: /, role: TerraformProv, ugid: terraform@pve!iac}

# Cluster (manual for now, see roles/pve_config/tasks/cluster.yml).
pve_cluster_name: INFRA-CLUSTER
pve_qdevice: 10.1.240.13
