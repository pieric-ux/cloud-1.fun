---
# Layer 10 - bare metal through the BMC (role redfish_bootstrap).
#   default            read-only probe:    ansible-playbook 10-bootstrap.yml --limit pve01
#   --tags media-test  mount/eject the stock ISO, no boot change, no reboot
#   --tags build-iso   build the auto-install ISO per host (local, Docker)
#   --tags install     DESTRUCTIVE reinstall, needs -e pve_install_confirm=true
#   --tags pve-config  configure the Proxmox nodes (checked live 2026-10-30),
#                      preview with --check --diff, needs -e pve_config_confirm=true
#   --tags pbs-config  configure the Proxmox Backup Server (VM 2400), same
#                      preview, needs -e pbs_config_confirm=true

- name: Bare-metal hosts through the BMC (probe, media test, ISO build)
  hosts: baremetal
  connection: local
  # Only HTTPS calls to the iLO: no local privilege needed (overrides become=True in ansible.cfg).
  become: false
  gather_facts: false
  vars:
    # Modules run on the controller: use Ansible's own Python instead of
    # auto-discovery (may pick a broken pyenv shim). Kept at play level, not in
    # group_vars/baremetal: these hosts are also reached over SSH by later layers.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults: &ilo_api
    ansible.builtin.uri:
      user: "{{ ilo_user }}"
      password: "{{ ilo_password }}"
      force_basic_auth: true
      validate_certs: "{{ ilo_validate_certs }}"
      status_code: [200, 202, 204]

  tasks:
    - name: Read-only probe of the BMC
      ansible.builtin.import_role:
        name: redfish_bootstrap
        tasks_from: probe

    - name: Virtual media mount/eject test
      ansible.builtin.import_role:
        name: redfish_bootstrap
        tasks_from: media_test
      tags: [never, media-test]

    - name: Build the auto-install ISO
      ansible.builtin.import_role:
        name: redfish_bootstrap
        tasks_from: build_iso
      tags: [never, build-iso]

# DESTRUCTIVE: unattended reinstall, WIPES the system disk. Prerequisites: ISO
# built (--tags build-iso) and served from 10-bootstrap/build/ (npx http-server),
# node emptied of its VMs, group informed.
#   ansible-playbook 10-bootstrap.yml --tags install --limit pve02 -e pve_install_confirm=true
- name: Reinstall Proxmox on bare-metal hosts through the BMC (DESTRUCTIVE)
  hosts: baremetal
  connection: local
  become: false
  gather_facts: false
  # One node at a time, and stop everything if one fails: never lose both nodes.
  serial: 1
  any_errors_fatal: true
  tags: [never, install]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults: *ilo_api

  tasks:
    - name: Reinstall Proxmox
      ansible.builtin.import_role:
        name: redfish_bootstrap
        tasks_from: install

# Proxmox node configuration after an install (checked with --check --diff
# against the live nodes on 2026-10-30). Over SSH, unlike the plays above.
- name: Configure the Proxmox nodes
  hosts: pve
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags: [never, pve-config]

  tasks:
    - name: Node configuration
      ansible.builtin.import_role:
        name: pve_config

# Proxmox Backup Server (VM 2400 on pve02), once the VM is installed: the
# backups of every other guest go through it (checked with --check --diff
# against the live VM on 2026-10-30).
- name: Configure the Proxmox Backup Server
  hosts: backup
  become: true
  gather_facts: false
  tags: [never, pbs-config]

  tasks:
    - name: Backup server configuration
      ansible.builtin.import_role:
        name: pbs_config
