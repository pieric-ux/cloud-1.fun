apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: nginx
  name: nginx-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8">
      <title>Module05 - ConfigMap</title>
    </head>
    <body>
      <h1>Hello from k3s!</h1>
      <p>Cette page est servie par nginx depuis une ConfigMap.</p>
    </body>
    </html>
